<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" fill="none">
<defs>
 <linearGradient id="bg" x1="50" y1="0" x2="1160" y2="460" gradientUnits="userSpaceOnUse"><stop stop-color="#06131F"/><stop offset=".52" stop-color="#0A2633"/><stop offset="1" stop-color="#11162D"/></linearGradient>
 <linearGradient id="wire" x1="620" y1="50" x2="1150" y2="420" gradientUnits="userSpaceOnUse"><stop stop-color="#5EEAD4"/><stop offset=".52" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
 <radialGradient id="aura"><stop stop-color="#2DD4BF" stop-opacity=".24"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="32"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M36 0H0V36" stroke="#A5F3FC" stroke-opacity=".065"/></pattern>
</defs>
<rect width="1200" height="460" rx="24" fill="url(#bg)"/>
<rect width="1200" height="460" rx="24" fill="url(#grid)"/>
<ellipse cx="920" cy="220" rx="300" ry="260" fill="url(#aura)" filter="url(#blur)"/>
<!-- depth planes -->
<g opacity=".22" stroke="#67E8F9" stroke-width="1">
 <path d="M620 370L860 115L1150 185L920 420Z"/><path d="M680 400L920 145L1180 215"/><path d="M740 430L980 175L1200 245"/>
 <path d="M700 320L1040 80M770 370L1110 130M840 420L1180 180"/>
</g>
<!-- 3D network mesh -->
<g stroke="url(#wire)" stroke-width="1.7" opacity=".8">
 <path d="M720 120L850 78L1000 118L1115 72L1140 205L1020 282L870 250L720 300L720 120Z"/>
 <path d="M720 120L870 250L850 78L1020 282L1000 118L1140 205L1115 72"/>
 <path d="M850 78L870 250M1000 118L1020 282M1115 72L1000 118"/>
 <path d="M720 300L870 250L1020 282L1140 205"/>
 <path d="M720 120L1020 282" opacity=".35"/>
</g>
<!-- orbit rings create spatial/3D depth -->
<g transform="translate(930 205)" stroke="#5EEAD4" fill="none">
 <ellipse rx="205" ry="68" stroke-opacity=".42" transform="rotate(-25)"/>
 <ellipse rx="205" ry="68" stroke-opacity=".28" transform="rotate(34)"/>
 <ellipse rx="150" ry="48" stroke="#38BDF8" stroke-opacity=".3" transform="rotate(78)"/>
 <g><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="42s" repeatCount="indefinite"/></g>
</g>
<!-- nodes -->
<g fill="#081B28" stroke="url(#wire)" stroke-width="2">
 <circle cx="720" cy="120" r="7"/><circle cx="850" cy="78" r="6"/><circle cx="1000" cy="118" r="9"/><circle cx="1115" cy="72" r="6"/><circle cx="1140" cy="205" r="7"/><circle cx="1020" cy="282" r="9"/><circle cx="870" cy="250" r="7"/><circle cx="720" cy="300" r="6"/>
</g>
<g filter="url(#glow)">
 <circle cx="1000" cy="118" r="3" fill="#A5F3FC"/><circle cx="1020" cy="282" r="3" fill="#A5F3FC"/>
</g>
<!-- traveling packets along network paths -->
<g fill="#D5FFFA" filter="url(#glow)">
 <circle r="4"><animateMotion dur="6s" repeatCount="indefinite" path="M720 120L850 78L1000 118L1140 205L1020 282L870 250L720 300"/></circle>
 <circle r="3"><animateMotion dur="8s" begin="-3s" repeatCount="indefinite" path="M1115 72L1000 118L870 250L720 120"/></circle>
 <circle r="3"><animateMotion dur="7s" begin="-1.5s" repeatCount="indefinite" path="M720 300L870 250L1020 282L1140 205"/></circle>
</g>
<!-- breathing node halos -->
<g fill="none" stroke="#5EEAD4">
 <circle cx="1000" cy="118" r="17" stroke-opacity=".5"><animate attributeName="r" values="12;28;12" dur="4s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".55;0;.55" dur="4s" repeatCount="indefinite"/></circle>
 <circle cx="870" cy="250" r="14" stroke-opacity=".45"><animate attributeName="r" values="10;23;10" dur="5s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="1140" cy="205" r="13" stroke-opacity=".4"><animate attributeName="r" values="9;21;9" dur="4.6s" repeatCount="indefinite"/><animate attributeName="stroke-opacity" values=".5;0;.5" dur="4.6s" repeatCount="indefinite"/></circle>
</g>
<!-- floating micro particles -->
<g fill="#67E8F9" opacity=".8">
 <circle cx="790" cy="42" r="2"><animate attributeName="cy" values="42;24;42" dur="5s" repeatCount="indefinite"/></circle>
 <circle cx="1080" cy="350" r="2"><animate attributeName="cy" values="350;328;350" dur="6s" repeatCount="indefinite"/></circle>
 <circle cx="1160" cy="320" r="1.5"><animate attributeName="cx" values="1160;1140;1160" dur="7s" repeatCount="indefinite"/></circle>
 <circle cx="780" cy="355" r="1.5"><animate attributeName="cx" values="780;800;780" dur="6s" repeatCount="indefinite"/></circle>
</g>
<g fill="#A5F3FC" font-family="monospace" font-size="10" letter-spacing="2"><text x="706" y="102">EVENT STREAM</text><text x="1016" y="105">API</text><text x="1090" y="55">CLOUD</text><text x="690" y="323">DATA</text><text x="1035" y="307">LLM / RAG</text></g>
<g fill="#E2E8F0" font-family="Arial,Helvetica,sans-serif">
 <text x="70" y="72" font-size="13" letter-spacing="4" fill="#5EEAD4">ENGINEERING / SYSTEMS / SOFTWARE</text>
 <text x="66" y="174" font-size="58" font-weight="700" letter-spacing="-2">Ayush Anand</text>
 <text x="66" y="238" font-size="58" font-weight="700" letter-spacing="-2">Srivastava<tspan fill="#5EEAD4">.</tspan></text>
 <text x="70" y="286" font-size="20" fill="#CBD5E1">Lead Software Engineer</text>
 <text x="70" y="329" font-size="12" fill="#94A3B8" letter-spacing="1.6">BACKEND SYSTEMS  ·  DISTRIBUTED ARCHITECTURE  ·  APPLIED AI</text>
</g>
<path d="M70 365H410" stroke="url(#wire)" stroke-width="2" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="4s" repeatCount="indefinite"/></path>
<circle cx="70" cy="365" r="4" fill="#5EEAD4"/>
<g fill="#64748B" font-family="monospace" font-size="10" letter-spacing="2"><text x="70" y="402">BUILD WITH INTENT. OPERATE WITH CONFIDENCE.</text><text x="1128" y="430" text-anchor="end">PROFILE / 01</text></g>
</svg>