<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="460" viewBox="0 0 1200 460" fill="none">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="460"><stop stop-color="#071522"/><stop offset=".55" stop-color="#0B2534"/><stop offset="1" stop-color="#10172C"/></linearGradient>
 <linearGradient id="edge" x1="650" y1="45" x2="1100" y2="410"><stop stop-color="#99F6E4"/><stop offset=".48" stop-color="#38BDF8"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
 <linearGradient id="front" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#17465A"/><stop offset="1" stop-color="#0C2638"/></linearGradient>
 <linearGradient id="side" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#12354B"/><stop offset="1" stop-color="#091A2B"/></linearGradient>
 <radialGradient id="mist"><stop stop-color="#2DD4BF" stop-opacity=".24"/><stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/></radialGradient>
 <filter id="soft"><feGaussianBlur stdDeviation="25"/></filter>
 <filter id="shine"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#9BE7F5" fill-opacity=".13"/></pattern>
</defs>
<rect width="1200" height="460" rx="24" fill="url(#bg)"/>
<rect width="1200" height="460" rx="24" fill="url(#dots)"/>
<ellipse cx="915" cy="230" rx="310" ry="245" fill="url(#mist)" filter="url(#soft)"/>

<!-- Ground plane: true isometric perspective grid -->
<g opacity=".22" stroke="#67E8F9" stroke-width="1">
 <path d="M600 365L910 205L1195 350L890 455Z"/>
 <path d="M650 390L955 230M705 417L1010 258M760 443L1065 285M815 462L1120 313"/>
 <path d="M710 310L1010 460M780 273L1080 422M850 237L1150 386M920 205L1195 350"/>
</g>

<!-- Floating isometric platform, with visible top, front and side faces -->
<g>
 <path d="M694 250L933 126L1147 236L908 365Z" fill="#0D3043" stroke="#4DD8DC" stroke-opacity=".8" stroke-width="1.6"/>
 <path d="M694 250L908 365V405L694 289Z" fill="url(#front)" stroke="#2DD4BF" stroke-opacity=".55"/>
 <path d="M908 365L1147 236V278L908 405Z" fill="url(#side)" stroke="#38BDF8" stroke-opacity=".55"/>
 <path d="M694 250L933 126L1147 236L908 365Z" fill="url(#mist)" opacity=".6"/>
 <path d="M710 251L933 139L1128 238L907 350Z" stroke="#A5F3FC" stroke-opacity=".27" stroke-dasharray="4 7"/>
</g>

<!-- Isometric buildings / compute blocks with top and side planes -->
<g stroke="url(#edge)" stroke-width="1.5" stroke-linejoin="round">
 <!-- node block A -->
 <path d="M758 199L827 164L895 199L826 236Z" fill="#17465A"/>
 <path d="M758 199L826 236V300L758 263Z" fill="#0E2A3E"/>
 <path d="M826 236L895 199V263L826 300Z" fill="#091E31"/>
 <path d="M774 201L827 174L879 201L826 229Z" stroke="#A5F3FC" stroke-opacity=".6" fill="none"/>
 <path d="M774 215L774 255L826 282L826 242" stroke="#38BDF8" stroke-opacity=".32"/>
 <!-- node block B -->
 <path d="M943 168L1002 138L1061 168L1002 201Z" fill="#19465D"/>
 <path d="M943 168L1002 201V260L943 228Z" fill="#0E2C41"/>
 <path d="M1002 201L1061 168V228L1002 260Z" fill="#0B2033"/>
 <path d="M958 169L1002 146L1046 169L1002 192Z" stroke="#A5F3FC" stroke-opacity=".55" fill="none"/>
 <!-- node block C -->
 <path d="M850 275L911 244L974 277L912 311Z" fill="#19445D"/>
 <path d="M850 275L912 311V358L850 325Z" fill="#0C293D"/>
 <path d="M912 311L974 277V324L912 358Z" fill="#091E31"/>
</g>

<!-- Network paths run across the raised structure -->
<g stroke="url(#edge)" stroke-width="2" opacity=".9">
 <path d="M790 215L827 194L1002 169L1090 213L945 291L879 297L790 215"/>
 <path d="M827 194L879 297M1002 169L945 291M1090 213L1045 265"/>
 <path d="M790 215L754 170L850 120L1002 169"/>
 <path d="M879 297L827 337L945 375L1090 300L1090 213"/>
</g>

<!-- Nodes -->
<g fill="#071B29" stroke="#8BE9E3" stroke-width="2" filter="url(#shine)">
 <circle cx="790" cy="215" r="6"/><circle cx="827" cy="194" r="7"/><circle cx="1002" cy="169" r="8"/>
 <circle cx="1090" cy="213" r="6"/><circle cx="945" cy="291" r="8"/><circle cx="879" cy="297" r="6"/>
 <circle cx="754" cy="170" r="5"/><circle cx="850" cy="120" r="6"/><circle cx="1045" cy="265" r="5"/>
</g>

<!-- Moving data packets across edges -->
<g fill="#E0FFFB" filter="url(#shine)">
 <circle r="4"><animateMotion dur="5.5s" repeatCount="indefinite" path="M754 170L850 120L1002 169L1090 213L945 291L879 297L790 215Z"/></circle>
 <circle r="3"><animateMotion dur="7s" begin="-2.8s" repeatCount="indefinite" path="M790 215L827 194L1002 169L945 291L879 297L827 337"/></circle>
 <circle r="3"><animateMotion dur="6.2s" begin="-4s" repeatCount="indefinite" path="M1090 300L945 375L879 297L1002 169"/></circle>
</g>

<!-- Expanding depth rings -->
<g fill="none" stroke="#5EEAD4">
 <ellipse cx="925" cy="245" rx="218" ry="85" stroke-opacity=".35" transform="rotate(-24 925 245)"/>
 <ellipse cx="925" cy="245" rx="165" ry="62" stroke-opacity=".22" transform="rotate(33 925 245)"/>
 <ellipse cx="925" cy="245" rx="240" ry="96" stroke-opacity=".18" transform="rotate(63 925 245)"/>
 <ellipse cx="1002" cy="169" rx="17" ry="9" stroke-opacity=".7"><animate attributeName="rx" values="12;29;12" dur="3.8s" repeatCount="indefinite"/><animate attributeName="ry" values="7;17;7" dur="3.8s" repeatCount="indefinite" /></ellipse>
 <ellipse cx="945" cy="291" rx="15" ry="8" stroke-opacity=".65"><animate attributeName="rx" values="10;25;10" dur="4.5s" repeatCount="indefinite"/><animate attributeName="ry" values="6;14;6" dur="4.5s" repeatCount="indefinite"/></ellipse>
</g>

<!-- Tiny drifting particles to add depth -->
<g fill="#A5F3FC" opacity=".8">
 <circle cx="733" cy="100" r="2"><animate attributeName="cy" values="100;82;100" dur="4.8s" repeatCount="indefinite"/></circle>
 <circle cx="1120" cy="112" r="1.8"><animate attributeName="cy" values="112;130;112" dur="5.5s" repeatCount="indefinite"/></circle>
 <circle cx="1070" cy="375" r="2"><animate attributeName="cx" values="1070;1090;1070" dur="6s" repeatCount="indefinite"/></circle>
 <circle cx="780" cy="350" r="1.7"><animate attributeName="cy" values="350;330;350" dur="5.2s" repeatCount="indefinite"/></circle>
</g>

<!-- Intro typography -->
<g fill="#E2E8F0" font-family="Arial,Helvetica,sans-serif">
 <text x="70" y="75" font-size="13" letter-spacing="4" fill="#5EEAD4">ENGINEERING / SYSTEMS / SOFTWARE</text>
 <text x="66" y="177" font-size="58" font-weight="700" letter-spacing="-2">Ayush Anand</text>
 <text x="66" y="241" font-size="58" font-weight="700" letter-spacing="-2">Srivastava<tspan fill="#5EEAD4">.</tspan></text>
 <text x="70" y="289" font-size="20" fill="#CBD5E1">Lead Software Engineer</text>
 <text x="70" y="330" font-size="12" fill="#94A3B8" letter-spacing="1.6">BACKEND SYSTEMS  ·  DISTRIBUTED ARCHITECTURE  ·  APPLIED AI</text>
</g>
<path d="M70 368H405" stroke="url(#edge)" stroke-width="2" stroke-dasharray="7 7"><animate attributeName="stroke-dashoffset" from="0" to="-56" dur="4s" repeatCount="indefinite"/></path>
<circle cx="70" cy="368" r="4" fill="#5EEAD4"/>
<g fill="#64748B" font-family="monospace" font-size="10" letter-spacing="2"><text x="70" y="405">BUILD WITH INTENT. OPERATE WITH CONFIDENCE.</text><text x="1128" y="430" text-anchor="end">PROFILE / 01</text></g>
</svg>